[package]
name = "yowie-phys"
description = "2D and 3D rigid bodies, joints, queries and character controllers, plus cloth, soft bodies and 2D fluids, for Yowie"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
yowie-core.workspace = true
rapier2d = { workspace = true, features = ["debug-render"] }
rapier3d = { workspace = true, features = ["debug-render"] }
thiserror.workspace = true
log.workspace = true
rayon = { workspace = true, optional = true }
yowie-gfx = { workspace = true, optional = true }

[features]
default = []
rayon = ["dep:rayon"]
# Adds `GfxDebugDraw`, which draws a 2D world's debug lines with the renderer.
gfx = ["dep:yowie-gfx"]
